{% set name = "onnxscript" %}
{% set version = "0.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/microsoft/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: ba4e0042546aceccf29ae651800771d6a84df44fec70df9b270dc7f804b141bc

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<39]

requirements:
  host:
    - pip
    - python
    - setuptools >=70.0.0
  run:
    - python
    - ml_dtypes
    - numpy
    - onnx-ir >=0.1.12,<2
    - onnx >=1.16
    - packaging
    - typing_extensions >=4.10

# Some tests are using the models stored in git-lfs which requires manually downloading the models from git-lfs
# serialized = b'version https://git-lfs.github.com/spec/v1\noid sha256:12d24be13a03ea8ddebcc5ea229390d49fb0da08ad1df896b03703c664e2def1\nsize 46921843\n'
# >       decoded = typing.cast("Optional[int]", proto.ParseFromString(serialized))
# E       google.protobuf.message.DecodeError: Error parsing message with type 'onnx.ModelProto'
{% set tests_to_skip = "test_serialization_deserialization_produces_same_model_000" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_001" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_002" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_0030" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_0031" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_0032" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_0033" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_0034" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_0035" %}
{% set tests_to_skip = tests_to_skip + " or test_serialization_deserialization_produces_same_model_0036" %}
{% set tests_to_skip = tests_to_skip + " or test_model_runs_and_matches_accuracy_after_optimization_0_mobilenetv2_100" %}
{% set tests_to_skip = tests_to_skip + " or test_model_runs_and_matches_accuracy_after_optimization_1_Speech2Text2ForCausalLM" %}
{% set tests_to_skip = tests_to_skip + " or test_model_runs_and_matches_accuracy_after_optimization_2_resnet18" %}
{% set tests_to_skip = tests_to_skip + " or test_optimizer_after_inlining" %}
{% set tests_to_skip = tests_to_skip + " or test_it_can_be_serialized_as_graph_proto" %}
{% set tests_to_skip = tests_to_skip + " or test_model_runs_and_matches_accuracy_after_conversion_fallback_true" %}
# version of onnxruntime available doesn't support SplitToSequence
# E       onnxruntime.capi.onnxruntime_pybind11_state.NotImplemented: [ONNXRuntimeError] : 9 : 
# NOT_IMPLEMENTED : Could not find an implementation for SplitToSequence(11) node with name '_inlfunc_aten_split_with_sizes_n0
{% set deselect_tests = " --deselect=tests/function_libs/torch_lib/ops_test.py::TestOutputConsistencyFullGraphCPU::test_output_match_opinfo__split_list_args_cpu_bool" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/function_libs/torch_lib/ops_test.py::TestOutputConsistencyFullGraphCPU::test_complex_output_match_opinfo__matmul_cpu_complex64" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/function_libs/torch_lib/ops_test.py::TestOutputConsistencyFullGraphCPU::test_output_match_opinfo__split_cpu_bool" %}
{% set deselect_tests = deselect_tests + " --deselect=tests/function_libs/torch_lib/ops_test.py::TestOutputConsistencyFullGraphCPU::test_output_match_opinfo__split_with_sizes_cpu_bool" %}
# E RuntimeError: Field 'shape' of 'type' is required but missing.
{% set deselect_tests = deselect_tests + " --deselect=tests/functions/onnxfns_test.py::TestOnnxFns::test_onnxfns_hard_clip" %}

{% set ignore_tests = "" %}
# TODO: remove when onnxruntime is available for py314
{% set ignore_tests = ignore_tests + " --ignore=tests/eager_test.py" %}                        # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/eager_mode_test.py" %}                   # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/function_libs/torch_lib/ops_test.py" %}  # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/functions/attr_test.py" %}               # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/functions/gemmgelu_test.py" %}           # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/functions/if_test.py" %}                 # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/functions/onnxfns1A_test.py" %}          # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/functions/onnxfns2_test.py" %}           # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/functions/onnxfns_test.py" %}            # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/if_test.py" %}                           # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/loop_test.py" %}                         # [py==314]
{% set ignore_tests = ignore_tests + " --ignore=tests/optimizer/test_models.py" %}             # [py==314]

test:
  source_files:
    - tests
    - testdata
  imports:
    - onnxscript
  requires:
    - pip
    - pytest !=7.1.0
    - parameterized
    - pytorch >=2.3
    - onnxruntime >=1.17.0  # [py<314]
    - torchvision >=0.18.0  # [py<314]
    - expecttest >=0.1.6
  commands:
    - pip check
    - pytest -v tests {{ ignore_tests }} -k "not ({{ tests_to_skip }})" {{ deselect_tests }}

about:
  home: https://microsoft.github.io/onnxscript
  summary: Naturally author ONNX functions and models using a subset of Python
  description: Naturally author ONNX functions and models using a subset of Python
  license: MIT
  license_file: LICENSE
  license_family: MIT
  doc_url: https://microsoft.github.io/onnxscript
  dev_url: https://github.com/microsoft/onnxscript

extra:
  recipe-maintainers:
    - apmorton
